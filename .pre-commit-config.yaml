repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: |
          (?x)
          ^internal/(repl|starlarktest)/vendor/ # vendored upstream sources
          | _star_test\.mbt$ # generated pre-build embed outputs
      - id: end-of-file-fixer
        exclude: |
          (?x)
          moon\.pkg$ # moon package manifests (DSL, no trailing newline)
          | pkg\.generated\.mbti$ # generated interface files
          | ^internal/(repl|starlarktest)/vendor/ # vendored upstream sources
          | _star_test\.mbt$ # generated pre-build embed outputs
      - id: check-json
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=2048"]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.1
    hooks:
      - id: markdownlint-cli2
        args: ["--fix"]

  - repo: local
    hooks:
      - id: moon-fmt
        name: MoonBit Format
        entry: moon fmt
        language: system
        files: '\.mbt(\.md)?$'
        pass_filenames: false
      - id: moon-check
        name: MoonBit Check
        entry: moon check --deny-warn
        language: system
        files: '\.mbt(\.md)?$'
        pass_filenames: false
      - id: moon-test
        name: MoonBit Test
        entry: moon test
        language: system
        files: '\.mbt(\.md)?$'
        pass_filenames: false

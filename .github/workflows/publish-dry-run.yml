name: Publish dry run

on:
  workflow_dispatch:

run-name: Publish dry run on ${{ github.ref_name }}

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hustcer/setup-moonbit@618b32d610fecdbe9069cefcc01b7bcdb03ede29 # v1.26
        with:
          version: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update package registry
        shell: bash
        run: moon update

      - name: Package
        shell: bash
        run: moon package

      - name: Verify mooncakes credentials
        shell: bash
        run: bash .github/scripts/verify-publish-credentials.sh
        env:
          MOONCAKES_CREDENTIALS: ${{ secrets.MOONCAKES_CREDENTIALS }}

name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

run-name: CI on ${{ github.head_ref || github.ref_name }}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      # Detect changed files to skip subsequent steps when no relevant files are modified
      - name: Detect changed files
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            code:
              - '.github/workflows/ci.yml'
              - '**/*.mbt.md'
              - 'examples/**'
              - 'moon.mod'
              - 'moon.work'
              - 'scripts/**'
              - 'src/**'

      - name: Setup Moonbit
        if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        uses: hustcer/setup-moonbit@9199da0ab63ea0c0bab1dc15f03d76e17ed4f75f # v1.22
        with:
          version: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update package registry
        if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        run: moon update

      - name: Check formatting
        if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        run: moon fmt --check

      - name: Check packages
        if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        run: moon check --deny-warn --target all

      - name: Verify generated interfaces are current
        if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        run: moon info && git diff --exit-code

      - name: Skip CI checks (no relevant changes)
        if: steps.filter.outputs.code != 'true' && github.event_name != 'workflow_dispatch'
        run: echo "No changes detected in code-related files."

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      # Detect changed files to skip subsequent steps when no relevant files are modified
      - name: Detect changed files
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            code:
              - '.github/workflows/ci.yml'
              - '**/*.mbt.md'
              - 'examples/**'
              - 'moon.mod'
              - 'moon.work'
              - 'scripts/**'
              - 'src/**'

      - name: Setup Moonbit
        if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        uses: hustcer/setup-moonbit@9199da0ab63ea0c0bab1dc15f03d76e17ed4f75f # v1.22
        with:
          version: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update package registry
        if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        run: moon update

      - name: Test all targets
        if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        run: moon test --target all

      - name: Run examples
        if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        run: bash scripts/run-examples.sh > /dev/null

      - name: Run REPL piped integration tests
        if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        run: bash scripts/test-repl-piped.sh > /dev/null

      - name: Skip CI checks (no relevant changes)
        if: steps.filter.outputs.code != 'true' && github.event_name != 'workflow_dispatch'
        run: echo "No changes detected in code-related files."

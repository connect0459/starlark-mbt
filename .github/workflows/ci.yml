name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

run-name: CI on ${{ github.head_ref || github.ref_name }}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - '.github/workflows/ci.yml'
              - '**/*.mbt.md'
              - 'examples/**'
              - 'moon.mod'
              - 'moon.work'
              - 'scripts/**'
              - 'src/**'

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: hustcer/setup-moonbit@87e2bdf5cf20d3b6f5c5f266a8a513f503bb5b76 # v1.25
        with:
          version: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update package registry
        shell: bash
        run: moon update

      - name: Check formatting
        shell: bash
        run: moon fmt --check

      - name: Check packages
        shell: bash
        run: moon check --deny-warn --target all

      - name: Verify generated interfaces are current
        shell: bash
        run: moon info && git diff --exit-code

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: hustcer/setup-moonbit@87e2bdf5cf20d3b6f5c5f266a8a513f503bb5b76 # v1.25
        with:
          version: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update package registry
        shell: bash
        run: moon update

      - name: Test all targets
        shell: bash
        run: moon test --target all

      - name: Run examples
        shell: bash
        run: bash scripts/run-examples.sh > /dev/null

      - name: Run REPL piped integration tests
        shell: bash
        run: bash scripts/test-repl-piped.sh > /dev/null

  # Single point of truth for branch protection
  gate:
    runs-on: ubuntu-latest
    needs:
      - changes
      - lint
      - test
    if: always()
    steps:
      - name: Verify all required jobs succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        shell: bash
        run: |
          echo "One or more required jobs did not succeed."
          exit 1

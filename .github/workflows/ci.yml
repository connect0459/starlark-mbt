name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

run-name: CI on ${{ github.head_ref || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Moonbit
        uses: hustcer/setup-moonbit@9199da0ab63ea0c0bab1dc15f03d76e17ed4f75f # v1.22
        with:
          version: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update package registry
        run: moon update

      - name: Check formatting
        run: moon fmt --check

      - name: Check packages
        run: moon check --deny-warn

      - name: Verify generated interfaces are current
        run: moon info && git diff --exit-code

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Moonbit
        uses: hustcer/setup-moonbit@9199da0ab63ea0c0bab1dc15f03d76e17ed4f75f # v1.22
        with:
          version: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update package registry
        run: moon update

      # Targets run sequentially within one job (one toolchain setup) rather
      # than as a matrix, trading a little wall-clock for fewer independent
      # network setups. All targets run even if one fails (matching the former
      # matrix `fail-fast: false`), and the job fails if any did.
      - name: Check and test all targets
        run: |
          rc=0
          for t in js wasm wasm-gc native; do
            echo "::group::$t"
            if ! (moon check --deny-warn --target "$t" && moon test --target "$t"); then
              echo "::error::target $t failed (check/test)"
              rc=1
            fi
            echo "::endgroup::"
          done
          exit $rc

      - name: Run examples
        run: bash scripts/run-examples.sh > /dev/null

      - name: Run REPL piped integration tests
        run: bash scripts/test-repl-piped.sh > /dev/null

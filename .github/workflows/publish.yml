name: Publish

on:
  push:
    tags:
      - "v*"

run-name: Publish ${{ github.ref_name }}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hustcer/setup-moonbit@87e2bdf5cf20d3b6f5c5f266a8a513f503bb5b76 # v1.25
        with:
          version: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update package registry
        shell: bash
        run: moon update

      - name: Verify tag matches module version
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          version="$(awk -F'"' '/^version[[:space:]]*=/{ print $2; exit }' moon.mod)"
          tag="${TAG#v}"
          test "$tag" = "$version"

      - name: Check
        shell: bash
        run: moon check --target all

      - name: Test
        shell: bash
        run: moon test --target all

      - name: Publish to mooncakes
        shell: bash
        run: |
          echo "$SECRET" > ~/.moon/credentials.json
          moon publish
          rm ~/.moon/credentials.json
        env:
          SECRET: ${{ secrets.MOONCAKES_CREDENTIALS }}

  # Runs only after mooncakes publish has succeeded, so a GitHub Release is
  # never created for a version that failed to publish.
  create-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: changelog
        uses: connect0459/extract-changelog-entry@ff85c8909583ffaa58df10a9f07f70752f860419 # v1.1.0
        with:
          ref-name: ${{ github.ref_name }}

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ steps.changelog.outputs.release-notes-path }}
